<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10142f">
  <meta name="description" content="Check your ICT Club membership status.">
  <title>ICT Club Membership Checker</title>

  <!-- Keep main.py in the same folder as this HTML file. -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f7ff;
      --muted: #a6afd2;
      --purple: #a78bfa;
      --blue: #60a5fa;
      --line: rgba(195, 205, 255, .16);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow-x: hidden;
      margin: 0;
      padding: 34px 18px;
      background:
        radial-gradient(ellipse at 16% 12%, rgba(106, 66, 201, .32), transparent 33%),
        radial-gradient(ellipse at 91% 83%, rgba(37, 99, 235, .27), transparent 34%),
        linear-gradient(135deg, #0a1028 0%, #111332 48%, #101b3d 100%);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      background-image:
        linear-gradient(rgba(190, 202, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(190, 202, 255, .035) 1px, transparent 1px);
      background-size: 48px 48px;
      content: "";
      mask-image: linear-gradient(to bottom, black, transparent 88%);
      pointer-events: none;
    }

    body::after {
      position: fixed;
      z-index: -1;
      top: 12%;
      right: 12%;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(139, 92, 246, .2);
      content: "";
      filter: blur(90px);
      pointer-events: none;
    }

    .membership-card {
      width: min(100%, 470px);
      padding: 29px;
      border: 1px solid rgba(224, 229, 255, .2);
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(36, 43, 82, .78), rgba(21, 28, 61, .72));
      box-shadow: 0 28px 90px rgba(3, 6, 22, .48), inset 0 1px 0 rgba(255, 255, 255, .08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 13px;
      background: linear-gradient(145deg, #8b5cf6, #3478f6);
      box-shadow: 0 8px 24px rgba(103, 87, 235, .34);
    }

    .brand-mark svg { width: 22px; height: 22px; }
    .brand-name { display: block; font-size: 13px; font-weight: 850; letter-spacing: .12em; }
    .brand-name span { color: #a9a2ff; }
    .brand-caption { display: block; margin-top: 3px; color: #929dc2; font-size: 8px; font-weight: 700; letter-spacing: .14em; }

    .member-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border: 1px solid rgba(198, 205, 255, .16);
      border-radius: 999px;
      background: rgba(255, 255, 255, .045);
      color: #c5cbed;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .1em;
      white-space: nowrap;
    }

    .member-badge::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #72e0bd;
      box-shadow: 0 0 10px rgba(114, 224, 189, .8);
      content: "";
    }

    .card-content { padding-top: 28px; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 13px;
      color: #aaa6ff;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 20px;
      height: 1px;
      background: linear-gradient(90deg, #9a7cff, #5ea2ff);
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 43px);
      font-weight: 760;
      letter-spacing: -.06em;
      line-height: 1.05;
    }

    h1 span {
      display: block;
      background: linear-gradient(95deg, #b49aff 8%, #77b8ff 90%);
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .intro {
      margin: 13px 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    form { display: grid; gap: 15px; }
    .field { display: grid; gap: 7px; }

    label {
      color: #dce1fa;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .04em;
    }

    .input-wrap { position: relative; }

    .input-wrap svg {
      position: absolute;
      top: 50%;
      left: 14px;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      color: #8793c5;
      pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 14px 0 42px;
      border: 1px solid rgba(191, 202, 255, .17);
      border-radius: 12px;
      outline: none;
      background: rgba(9, 15, 40, .44);
      color: #f7f8ff;
      font: inherit;
      font-size: 13px;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }

    input[type="text"]::placeholder { color: #7f8ab1; }
    input[type="text"]:hover { border-color: rgba(186, 190, 255, .34); }

    input[type="text"]:focus {
      border-color: #9b83ff;
      background: rgba(12, 18, 47, .72);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, .16);
    }

    .submit-button {
      display: flex;
      width: 100%;
      min-height: 49px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 12px;
      background: linear-gradient(100deg, #8057ed, #456ff0 58%, #398cf2);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      box-shadow: 0 9px 24px rgba(71, 92, 226, .3), inset 0 1px 0 rgba(255, 255, 255, .24);
      transition: transform .16s, filter .16s, box-shadow .16s;
    }

    .submit-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow: 0 12px 28px rgba(71, 92, 226, .4), inset 0 1px 0 rgba(255, 255, 255, .28);
    }

    .submit-button:active { transform: translateY(0); }

    .submit-button svg {
      width: 16px;
      height: 16px;
      transition: transform .16s;
    }

    .submit-button:hover svg { transform: translateX(3px); }

    #result {
      min-height: 45px;
      margin-top: 17px;
      padding: 12px 13px;
      border: 1px solid rgba(191, 202, 255, .13);
      border-radius: 11px;
      background: rgba(8, 14, 37, .36);
      color: #eef0ff;
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    #result:empty::before {
      color: #8490b8;
      content: "Your membership result will appear here.";
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      color: #8995bb;
      font-size: 9px;
    }

    .footer-note { display: inline-flex; align-items: center; gap: 7px; }
    .footer-note svg { width: 14px; height: 14px; color: #9c91ff; }
    .secure { color: #a8b4d6; font-weight: 700; letter-spacing: .04em; }

    .page-note {
      margin: 18px 0 0;
      color: rgba(190, 201, 239, .55);
      font-size: 8px;
      font-weight: 750;
      letter-spacing: .2em;
      text-align: center;
      text-transform: uppercase;
    }

    :focus-visible { outline: 3px solid rgba(147, 130, 255, .55); outline-offset: 3px; }

    @media (max-width: 480px) {
      body { padding: 22px 14px; }
      .membership-card { padding: 22px 19px; border-radius: 21px; }
      .card-top { padding-bottom: 18px; }
      .member-badge { padding: 7px 8px; font-size: 7px; }
      .brand-mark { width: 38px; height: 38px; }
      .card-content { padding-top: 24px; }
      .intro { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="membership-card">
    <div class="card-top">
      <a class="brand" href="#" aria-label="ICT Club home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="m8.5 7-5 5 5 5M15.5 7l5 5-5 5M13.5 4l-3 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span>
          <span class="brand-name">ICT <span>CLUB</span></span>
          <span class="brand-caption">STUDENT COMMUNITY</span>
        </span>
      </a>
      <span class="member-badge">MEMBERSHIP CHECKER</span>
    </div>

    <div class="card-content">
      <p class="eyebrow">Member access</p>
      <h1>Check your <span>membership.</span></h1>
      <p class="intro">Enter your name below to check your ICT Club membership status.</p>

      <form>
        <div class="field">
          <label for="first_name">First name</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6" />
              <path d="M5 20c.7-3.2 3.2-5 7-5s6.3 1.8 7 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <input type="text" id="first_name" name="first_name" placeholder="e.g. Alex" autocomplete="given-name" required>
          </div>
        </div>

        <div class="field">
          <label for="last_name">Last name</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.5 19.5c.8-3.1 3.3-4.8 7.5-4.8s6.7 1.7 7.5 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <circle cx="12" cy="7.8" r="3.4" stroke="currentColor" stroke-width="1.6" />
            </svg>
            <input type="text" id="last_name" name="last_name" placeholder="e.g. Rivera" autocomplete="family-name" required>
          </div>
        </div>

        <button class="submit-button" type="button" py-click="student_club">
          Check membership
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3.5 10h12M10 4.5l5.5 5.5-5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>

      <div id="result" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <div class="card-footer">
      <span class="footer-note">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 2.5 16 5v4.3c0 3.8-2.4 6.5-6 8.2-3.6-1.7-6-4.4-6-8.2V5l6-2.5Z" stroke="currentColor" stroke-width="1.4" />
          <path d="m7.5 9.8 1.7 1.7 3.5-3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        ICT Club member portal
      </span>
      <span class="secure">CONNECT · CREATE · CODE</span>
    </div>
  </main>

  <p class="page-note">Technology · Creativity · Community</p>

  <py-script src="main.py"></py-script>
</body>
</html>
